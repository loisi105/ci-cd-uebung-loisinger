name: CI

on:
  push:
    branches: [main]
    paths:
      - "pom.xml"
      - "src/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "pom.xml"
      - "src/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"

# Cancel superseded runs of the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17, 21]
        exclude:
          # Windows + JDK 17 adds little: JDK 17 is covered on Linux, Windows on the newer LTS
          - os: windows-latest
            java: 17
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run tests (Surefire + JaCoCo)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}-jdk${{ matrix.java }}
          path: target/site/jacoco/
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud analysis
    # Needs the secret, which is not available to PRs from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for blame / new-code detection

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode --no-transfer-progress -Dmaven.test.failure.ignore=true verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=loisi105
          -Dsonar.projectKey=loisi105_ci-cd-uebung-loisinger
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  docker:
    name: Docker image
    needs: [build-test, sonarcloud]
    # Also run when SonarCloud is skipped (PRs from forks), but never after a failure
    if: >-
      !cancelled() &&
      needs.build-test.result == 'success' &&
      (needs.sonarcloud.result == 'success' || needs.sonarcloud.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: loisi105/ci-cd-uebung:${{ steps.vars.outputs.short_sha }}

      - name: Export image to tar
        run: docker save --output "image-${{ steps.vars.outputs.short_sha }}.tar" "loisi105/ci-cd-uebung:${{ steps.vars.outputs.short_sha }}"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ steps.vars.outputs.short_sha }}
          path: image-${{ steps.vars.outputs.short_sha }}.tar
          if-no-files-found: error
